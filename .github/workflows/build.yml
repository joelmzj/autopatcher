name: Build

on:
  schedule:
    - cron: '0 * * * *'
  workflow_call:
    inputs:
      config_file:
        required: false
        type: string
        default: "config.toml"
      rebuild_preset:
        required: false
        type: string
        default: ""
      rebuild_custom:
        required: false
        type: string
        default: ""
    outputs:
      success:
        value: ${{ jobs.build.outputs.success }}
  workflow_dispatch:
    inputs:
      config_file:
        description: "Archivo de configuración a utilizar"
        required: false
        type: string
        default: "config.toml"
      rebuild_preset:
        description: "Preset rápido de apps a forzar (dropdown)"
        required: false
        type: choice
        default: ""
        options:
          # BEGIN: AUTO-GENERATED-APPS
          - ""
          - "*"
          - "Instagram"
          - "Telegram"
          - "Pinterest"
          - "Messenger"
          - "Facebook"
          - "TikTok"
          - "YouTubeMusic-Morphe"
          - "YouTubeMusic-anddea"
          - "YouTube-Morphe"
          - "YouTube-anddea"
          - "YouTube-Tablet-Morphe"
          - "YouTube-Tablet-anddea"
          - "GoogleMaps"
          - "Waze"
          - "X"
          - "Google-Photos"
          - "Projectivy-Launcher"
          - "TizenTube-Youtube-original"
          - "Stremio-TV"
          - "Stremio-Phone"
          - "Vix-TV"
          - "SendFilesToTV-TV"
          - "AnExplorer-TV"
          - "Tubi-TV"
          - "Pluto-TV"
          # END: AUTO-GENERATED-APPS
      rebuild_custom:
        description: "Apps adicionales (coma-separadas). Se combina con el preset. '*' = todas."
        required: false
        type: string
        default: ""

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    outputs:
      success: ${{ steps.build_step.outputs.success }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      cf_solver:
        # 🔧 FIX A1: pin del digest (antes `:latest` → regresiones silenciosas)
        # NOTA: la imagen ya trae su propio healthcheck interno. No añadir
        # uno personalizado con `curl` porque la imagen NO lo tiene instalado.
        image: ghcr.io/sarperavci/cloudflarebypassforscraping@sha256:9897d17b9fe5471f0f04c8d11c4ec4b147ff444cc0ee61e2b1788a743be9e718
        ports:
          - 8000:8000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies (jq, zip, python)
        run: |
          sudo apt-get update
          sudo apt-get install -y jq zip python3-pip
          python3 -m pip install toml requests curl_cffi

      - name: Install signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_P12_B64: ${{ secrets.KEYSTORE_P12_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          bash scripts/install_keystore.sh

      # 🔧 FIX A2: verificación real del solver contra download.php.
      # La API del solver (sarperavci) usa GET con query params, NO POST
      # con JSON. Si usas POST, devuelve 400 (missing url).
      #   - 200/200 → solver OK, si falla la descarga es bug de cf_get.py/utils.sh
      #   - 403/403 → IP del runner bloqueada a nivel WAF (no hay fix software)
      #   - 200/404 → tu versión del solver usa GET (fix B1 lo cubre)
      - name: Verify solver against APKMirror download.php
        continue-on-error: true
        run: |
          echo "Test 1: solver GET /html contra /uploads/"
          c1=$(curl -sS -o /dev/null -w "%{http_code}" \
            -G "http://localhost:8000/html" \
            --data-urlencode "url=https://www.apkmirror.com/uploads/?appcategory=youtube" \
            --max-time 120 || echo "000")
          echo "  /uploads/  → HTTP $c1"

          echo "Test 2: solver GET /cookies contra download.php (id de prueba)"
          c2=$(curl -sS -o /dev/null -w "%{http_code}" \
            -G "http://localhost:8000/cookies" \
            --data-urlencode "url=https://www.apkmirror.com/wp-content/themes/APKMirror/download.php?id=17427546&key=test" \
            --max-time 120 || echo "000")
          echo "  /cookies   → HTTP $c2"

          if [ "$c1" = "200" ] && [ "$c2" = "200" ]; then
            echo "✅ Solver responde en ambos endpoints"
          elif [ "$c1" = "200" ] && [ "$c2" = "404" ]; then
            echo "::warning:: Solver funciona en /uploads/ pero /cookies da 404."
            echo "::warning:: Tu versión del solver usa GET; el FIX B1 lo cubre."
          else
            echo "::warning:: Solver NO responde (uploads=$c1, cookies=$c2)."
            echo "::warning:: Si ambos dan 403, la IP del runner está bloqueada."
            echo "::warning:: No hay fix software; esperar IP limpia o cambiar a runner self-hosted."
          fi

      - name: Run Build and Patch Process
        id: build_step
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.PATCHES_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: "stable"
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_P12_B64: ${{ secrets.KEYSTORE_P12_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TOML: "./bin/toml/tq-x86_64"
          CF_SOLVER_URL: "http://localhost:8000"
        run: |
          # Combinar preset + custom en REBUILD_APPS
          PRESET="${{ inputs.rebuild_preset }}"
          CUSTOM="${{ inputs.rebuild_custom }}"

          if [ -n "$PRESET" ] && [ -n "$CUSTOM" ]; then
            REBUILD_APPS="${PRESET},${CUSTOM}"
          elif [ -n "$PRESET" ]; then
            REBUILD_APPS="${PRESET}"
          else
            REBUILD_APPS="${CUSTOM}"
          fi
          export REBUILD_APPS
          if [ -n "$REBUILD_APPS" ]; then
            echo "[i] REBUILD_APPS=$REBUILD_APPS"
          else
            echo "[i] REBUILD_APPS vacío (modo normal, solo cambios)"
          fi

          chmod +x scripts/*.sh
          chmod +x bin/toml/*
          CONFIG="${{ inputs.config_file }}"
          if [ -z "$CONFIG" ]; then
            CONFIG="config.toml"
          fi
          bash scripts/build.sh "$CONFIG"
          echo "success=true" >> $GITHUB_OUTPUT

      - name: Commit logs and versions_log
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add versions_log.json 2>/dev/null || true
          git add logs/ 2>/dev/null || true

          if ! git diff --staged --quiet; then
            git commit -m "chore: update versions_log.json + logs [skip ci]"
            git reset --hard HEAD
            git pull --rebase origin main || true
            git push
            echo "[+] Estado y logs commiteados exitosamente"
          else
            echo "[i] Sin cambios en estado/logs, omitiendo commit"
          fi

      - name: Publish update.json files to update branch
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git reset --hard HEAD 2>/dev/null || true
          git clean -fd 2>/dev/null || true

          MANIFEST="temp/uploaded_files.txt"
          if [ ! -f "$MANIFEST" ]; then
            echo "[i] No hay manifest ($MANIFEST). Omitiendo publicación de update.json."
            exit 0
          fi

          declare -a zips=()
          while IFS= read -r fname; do
            [ -z "$fname" ] && continue
            case "$fname" in
              *.zip)
                [ -f "build/$fname" ] && zips+=("build/$fname")
                ;;
            esac
          done < "$MANIFEST"

          if [ "${#zips[@]}" -eq 0 ]; then
            echo "[i] No hay ZIPs de módulos generados en este run. Omitiendo publicación de update.json."
            exit 0
          fi

          echo "[i] ZIPs a publicar: ${#zips[@]}"
          for z in "${zips[@]}"; do echo "  - $z"; done

          ORIGINAL_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          echo "[i] Branch original: $ORIGINAL_BRANCH"

          if git ls-remote --exit-code --heads origin update >/dev/null 2>&1; then
            echo "[i] La rama 'update' ya existe. Haciendo checkout..."
            git fetch origin update
            git checkout -B update origin/update
          else
            echo "[i] La rama 'update' no existe. Creándola huérfana..."
            git checkout --orphan update
            git rm -rf . 2>/dev/null || true
            cat > README.md <<'EOF'
          # Module update metadata

          Esta rama contiene los archivos `update.json` y changelogs
          usados por Magisk/KernelSU para detectar actualizaciones de módulos.
          EOF
            git add README.md
            git commit -m "chore: initialize update branch [skip ci]"
          fi

          mkdir -p stable dev changelogs
          vc=$(date -u +%Y%m%d%H)
          published=0

          for zip in "${zips[@]}"; do
            module_id=$(unzip -p "$zip" module.prop 2>/dev/null | grep '^id=' | cut -d= -f2)
            [ -z "$module_id" ] && continue

            channel="stable"
            case "$module_id" in
              *-dev-*) channel="dev" ;;
              *-stable-*) channel="stable" ;;
            esac

            arch_sfx="${module_id##*-}"
            no_arch="${module_id%-*}"
            app_slug="${no_arch%-*}"
            target_name="${app_slug}-${arch_sfx}"

            if unzip -p "$zip" update.json > "${channel}/${target_name}.json" 2>/dev/null; then
              echo "[+] Publicado ${channel}/${target_name}.json"
              published=$((published + 1))
            fi
          done

          {
            echo "# Build ${vc}"
            echo ""
            echo "Actualización automática de módulos Magisk/KernelSU."
            echo ""
            echo "- Fecha: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Módulos publicados: ${published}"
          } > "changelogs/${vc}.md"

          git add stable/ dev/ changelogs/ README.md 2>/dev/null || true
          
          if ! git diff --staged --quiet; then
            git commit -m "chore: publish module update.json [skip ci]"
            git reset --hard HEAD
            git pull --rebase origin update || true
            git push origin update
            echo "[+] Rama 'update' actualizada con ${published} módulos"
          else
            echo "[i] Sin cambios en la rama 'update'"
          fi

          git checkout "$ORIGINAL_BRANCH"
          echo "[i] De vuelta en el branch: $ORIGINAL_BRANCH"

      # ==================================================================
      # 🔧 FIX D1: propagar GITHUB_REPOSITORY para que el script de
      # Obtainium no dependa de REPO_URL hardcodeado (ver FIX D2 en .py)
      # ==================================================================
      - name: Generate and Commit Obtainium Links
        if: always()
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/generate_obtainium_links.py
          
          python3 - <<'PY'
          from pathlib import Path
          readme = Path("README.md")
          links = Path("OBTAINIUM_LINKS.md").read_text(encoding="utf-8")
          marker_start = "<!-- OBTAINIUM_LINKS_START -->"
          marker_end = "<!-- OBTAINIUM_LINKS_END -->"
          content = readme.read_text(encoding="utf-8") if readme.exists() else ""
          
          if marker_start in content and marker_end in content:
              pre, rest = content.split(marker_start, 1)
              _, post = rest.split(marker_end, 1)
              content = pre + marker_start + "\n" + links + "\n" + marker_end + post
          else:
              content += "\n\n" + marker_start + "\n" + links + "\n" + marker_end
              
          readme.write_text(content, encoding="utf-8")
          PY
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md OBTAINIUM_LINKS.md
          
          if ! git diff --staged --quiet; then
            git commit -m "docs: update Obtainium links [skip ci]"
            git reset --hard HEAD
            git pull --rebase origin main || true
            git push
            echo "[+] Enlaces de Obtainium actualizados en README.md"
          else
            echo "[i] Sin cambios en los enlaces de Obtainium"
          fi