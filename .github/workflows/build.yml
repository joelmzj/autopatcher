                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                - "X-new"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                # END: AUTO-GENERATED-APPS
      rebuild_custom:
        description: "Apps adicionales (coma-separadas). Se combina con el preset. '*' = todas."
        required: false
        type: string
        default: ""

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    outputs:
      success: ${{ steps.build_step.outputs.success }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      cf_solver:
        image: ghcr.io/sarperavci/cloudflarebypassforscraping:latest
        ports:
          - 8000:8000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies (jq, zip, python)
        run: |
          sudo apt-get update
          sudo apt-get install -y jq zip python3-pip
          python3 -m pip install toml requests curl_cffi

      - name: Install signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_P12_B64: ${{ secrets.KEYSTORE_P12_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          python3 -c "
          import glob
          for filepath in glob.glob('scripts/*.sh'):
              with open(filepath, 'rb') as f:
                  content = f.read()
              content = content.replace(b'\r\n', b'\n').replace(b'\r', b'\n').replace(b'\xc2\xa0', b' ')
              with open(filepath, 'wb') as f:
                  f.write(content)
          "
          bash scripts/install_keystore.sh

      - name: Run Build and Patch Process
        id: build_step
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.PATCHES_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: "stable"
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_P12_B64: ${{ secrets.KEYSTORE_P12_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TOML: "./bin/toml/tq-x86_64"
          CF_SOLVER_URL: "http://localhost:8000"
        run: |
          # Combinar preset + custom en REBUILD_APPS
          PRESET="${{ inputs.rebuild_preset }}"
          CUSTOM="${{ inputs.rebuild_custom }}"

          if [ -n "$PRESET" ] && [ -n "$CUSTOM" ]; then
            REBUILD_APPS="${PRESET},${CUSTOM}"
          elif [ -n "$PRESET" ]; then
            REBUILD_APPS="${PRESET}"
          else
            REBUILD_APPS="${CUSTOM}"
          fi
          export REBUILD_APPS
          if [ -n "$REBUILD_APPS" ]; then
            echo "[i] REBUILD_APPS=$REBUILD_APPS"
          else
            echo "[i] REBUILD_APPS vacío (modo normal, solo cambios)"
          fi

          chmod +x scripts/*.sh
          chmod +x bin/toml/*
          CONFIG="${{ inputs.config_file }}"
          if [ -z "$CONFIG" ]; then
            CONFIG="config.toml"
          fi
          bash scripts/build.sh "$CONFIG"
          echo "success=true" >> $GITHUB_OUTPUT

      - name: Commit logs and versions_log
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # versions_log.json (fuente de verdad) + logs por app
          # Incluye logs/*.log y logs/failed_apps.json
          git add versions_log.json 2>/dev/null || true
          git add logs/ 2>/dev/null || true

          # Commit solo si hay cambios
          if ! git diff --staged --quiet; then
            git commit -m "chore: update versions_log.json + logs [skip ci]"
            git push
            echo "[+] Estado y logs commiteados exitosamente"
          else
            echo "[i] Sin cambios en estado/logs, omitiendo commit"
          fi

      - name: Publish update.json files to update branch
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # ==================================================================
          # FIX: limpiar cambios locales (chmod +x, line-endings normalizados
          # en scripts/*.sh por el paso anterior, etc.) antes de cambiar de
          # rama. Sin esto, `git checkout` falla con:
          #   "Your local changes would be overwritten by checkout"
          # ==================================================================
          git reset --hard HEAD 2>/dev/null || true
          git clean -fd 2>/dev/null || true

          # Leer el manifest de archivos generados en este run (build.sh lo dejó en temp/)
          MANIFEST="temp/uploaded_files.txt"
          if [ ! -f "$MANIFEST" ]; then
            echo "[i] No hay manifest ($MANIFEST). Omitiendo publicación de update.json."
            exit 0
          fi

          # Filtrar solo los ZIPs generados en este run
          declare -a zips=()
          while IFS= read -r fname; do
            [ -z "$fname" ] && continue
            case "$fname" in
              *.zip)
                [ -f "build/$fname" ] && zips+=("build/$fname")
                ;;
            esac
          done < "$MANIFEST"

          if [ "${#zips[@]}" -eq 0 ]; then
            echo "[i] No hay ZIPs de módulos generados en este run. Omitiendo publicación de update.json."
            exit 0
          fi

          echo "[i] ZIPs a publicar: ${#zips[@]}"
          for z in "${zips[@]}"; do echo "  - $z"; done

          # Guardar branch original para volver al final
          ORIGINAL_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          echo "[i] Branch original: $ORIGINAL_BRANCH"

          # Checkout de la rama update (crear si no existe)
          if git ls-remote --exit-code --heads origin update >/dev/null 2>&1; then
            echo "[i] La rama 'update' ya existe. Haciendo checkout..."
            git fetch origin update
            git checkout -B update origin/update
          else
            echo "[i] La rama 'update' no existe. Creándola huérfana..."
            git checkout --orphan update
            git rm -rf . 2>/dev/null || true
            cat > README.md <<'EOF'
          # Module update metadata

          Esta rama contiene los archivos `update.json` y changelogs
          usados por Magisk/KernelSU para detectar actualizaciones de módulos.
          EOF
            git add README.md
            git commit -m "chore: initialize update branch [skip ci]"
          fi

          # Preparar directorios
          mkdir -p update/stable update/dev update/changelogs
          vc=$(date -u +%Y%m%d)
          published=0

          for zip in "${zips[@]}"; do
            # Leer el id del módulo desde module.prop dentro del ZIP
            module_id=$(unzip -p "$zip" module.prop 2>/dev/null | grep '^id=' | cut -d= -f2)
            [ -z "$module_id" ] && continue

            # Detectar canal desde el id (formato: {app_slug}-{channel}-{arch})
            channel="stable"
            case "$module_id" in
              *-dev-*) channel="dev" ;;
              *-stable-*) channel="stable" ;;
            esac

            # Quitar el sufijo -{channel}-{arch} para obtener {app_slug}-{arch}
            # Ej: "youtubemusic-morphe-dev-arm64" -> "youtubemusic-morphe-arm64"
            arch_sfx="${module_id##*-}"
            no_arch="${module_id%-*}"
            app_slug="${no_arch%-*}"
            target_name="${app_slug}-${arch_sfx}"

            if unzip -p "$zip" update.json > "update/${channel}/${target_name}.json" 2>/dev/null; then
              echo "[+] Publicado update/${channel}/${target_name}.json"
              published=$((published + 1))
            fi
          done

          # Changelog genérico
          {
            echo "# Build ${vc}"
            echo ""
            echo "Actualización automática de módulos Magisk/KernelSU."
            echo ""
            echo "- Fecha: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Módulos publicados: ${published}"
          } > "update/changelogs/${vc}.md"

          # Commit y push
          git add update/
          if ! git diff --staged --quiet; then
            git commit -m "chore: publish module update.json [skip ci]"
            git push origin update
            echo "[+] Rama 'update' actualizada con ${published} módulos"
          else
            echo "[i] Sin cambios en la rama 'update'"
          fi

          # Volver al branch original
          git checkout "$ORIGINAL_BRANCH"
          echo "[i] De vuelta en el branch: $ORIGINAL_BRANCH"