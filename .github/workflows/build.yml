name: Build

on:
  schedule:
    - cron: '0 * * * *'
  workflow_call:
    inputs:
      config_file:
        required: false
        type: string
        default: "config.toml"
      rebuild_preset:
        required: false
        type: string
        default: ""
      rebuild_custom:
        required: false
        type: string
        default: ""
    outputs:
      success:
        value: ${{ jobs.build.outputs.success }}
  workflow_dispatch:
    inputs:
      config_file:
        description: "Archivo de configuración a utilizar"
        required: false
        type: string
        default: "config.toml"
      rebuild_preset:
        description: "Preset rápido de apps a forzar (dropdown)"
        required: false
        type: choice
        default: ""
        options:
                                                                                                                                                                # BEGIN: AUTO-GENERATED-APPS
                                                                                - ""
                                                                                - "*"
                                                                                - "Instagram"
                                                                                - "Telegram"
                                                                                - "Pinterest"
                                                                                - "Messenger"
                                                                                - "Facebook"
                                                                                - "TikTok"
                                                                                - "YouTubeMusic-Morphe"
                                                                                - "YouTubeMusic-anddea"
                                                                                - "YouTube-Morphe"
                                                                                - "YouTube-anddea"
                                                                                - "YouTube-Tablet-anddea"
                                                                                - "YouTube-Tablet-Morphe"
                                                                                # END: AUTO-GENERATED-APPS
      rebuild_custom:
        description: "Apps adicionales (coma-separadas). Se combina con el preset. '*' = todas."
        required: false
        type: string
        default: ""

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    outputs:
      success: ${{ steps.build_step.outputs.success }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      cf_solver:
        image: ghcr.io/sarperavci/cloudflarebypassforscraping:latest
        ports:
          - 8000:8000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies (jq, zip, python)
        run: |
          sudo apt-get update
          sudo apt-get install -y jq zip python3-pip
          python3 -m pip install --no-cache-dir toml requests curl_cffi

      - name: Install signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_P12_B64: ${{ secrets.KEYSTORE_P12_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          python3 -c "
          import glob
          for filepath in glob.glob('scripts/*.sh'):
              with open(filepath, 'rb') as f:
                  content = f.read()
              content = content.replace(b'\r\n', b'\n').replace(b'\r', b'\n').replace(b'\xc2\xa0', b' ')
              with open(filepath, 'wb') as f:
                  f.write(content)
          "
          bash scripts/install_keystore.sh

      - name: Run Build and Patch Process
        id: build_step
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: "stable"
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_P12_B64: ${{ secrets.KEYSTORE_P12_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TOML: "./bin/toml/tq-x86_64"
          CF_SOLVER_URL: "http://localhost:8000"
        run: |
          # Combinar preset + custom en REBUILD_APPS
          PRESET="${{ inputs.rebuild_preset }}"
          CUSTOM="${{ inputs.rebuild_custom }}"

          if [ -n "$PRESET" ] && [ -n "$CUSTOM" ]; then
            REBUILD_APPS="${PRESET},${CUSTOM}"
          elif [ -n "$PRESET" ]; then
            REBUILD_APPS="${PRESET}"
          else
            REBUILD_APPS="${CUSTOM}"
          fi
          export REBUILD_APPS
          if [ -n "$REBUILD_APPS" ]; then
            echo "[i] REBUILD_APPS=$REBUILD_APPS"
          else
            echo "[i] REBUILD_APPS vacío (modo normal, solo cambios)"
          fi

          chmod +x scripts/*.sh
          chmod +x bin/toml/*
          CONFIG="${{ inputs.config_file }}"
          if [ -z "$CONFIG" ]; then
            CONFIG="config.toml"
          fi
          bash scripts/build.sh "$CONFIG"
          echo "success=true" >> $GITHUB_OUTPUT

      - name: Commit and push state files if updated
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # versions_log.json es la única fuente de verdad del pipeline
          git add versions_log.json 2>/dev/null || true

          # Commit solo si hay cambios
          if ! git diff --staged --quiet; then
            git commit -m "chore: update versions_log.json [skip ci]"
            git push
            echo "[+] Estado commiteado exitosamente"
          else
            echo "[i] Sin cambios en el estado, omitiendo commit"
          fi