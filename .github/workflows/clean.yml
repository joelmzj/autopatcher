name: Clean & Reset

on:
  workflow_dispatch:
    inputs:
      reset_versions_log:
        description: "Resetear versions_log.json → {} (vacía el historial de versiones)"
        required: false
        type: boolean
        default: true
      reset_failed_apps:
        description: "Resetear logs/failed_apps.json → {} (limpia la cola de reintentos)"
        required: false
        type: boolean
        default: false
      clean_logs:
        description: "Borrar logs/*.log (limpia el historial de parcheo por app)"
        required: false
        type: boolean
        default: false
      reset_snapshot:
        description: "Borrar el release 'snapshot' (backup de versiones previas)"
        required: false
        type: boolean
        default: false
      delete_stable:
        description: "Borrar el release 'stable' (se recrea en el próximo Build)"
        required: false
        type: boolean
        default: false
      delete_workflow_cache:
        description: "Borrar la caché de GitHub Actions (pip, apt, etc.)"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

# Mismo grupo que el workflow Build → se serializan y no hay colisión
# mientras Clean borra assets y Build los sube.
concurrency:
  group: build
  cancel-in-progress: false

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ======================================================================
      # 1. Resetear versions_log.json
      # ======================================================================
      - name: Reset versions_log.json
        if: ${{ inputs.reset_versions_log }}
        run: |
          echo '{}' > versions_log.json
          echo "[+] versions_log.json reseteado"

      # ======================================================================
      # 2. Resetear logs/failed_apps.json
      # ======================================================================
      - name: Reset failed apps queue
        if: ${{ inputs.reset_failed_apps }}
        run: |
          mkdir -p logs
          echo '{}' > logs/failed_apps.json
          echo "[+] logs/failed_apps.json reseteado"

      # ======================================================================
      # 3. Limpiar logs/*.log
      # ======================================================================
      - name: Clean per-app logs
        if: ${{ inputs.clean_logs }}
        run: |
          if [ -d logs ]; then
            count=$(find logs -maxdepth 1 -name '*.log' 2>/dev/null | wc -l | tr -d ' ')
            rm -f logs/*.log
            echo "[+] $count logs/*.log eliminados"
          else
            echo "[i] No existe logs/"
          fi

      # ======================================================================
      # 4. Commit de los cambios en versions_log y/o logs
      # ======================================================================
      - name: Commit state changes
        if: ${{ inputs.reset_versions_log || inputs.reset_failed_apps || inputs.clean_logs }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add versions_log.json 2>/dev/null || true
          git add logs/ 2>/dev/null || true

          if ! git diff --staged --quiet; then
            git commit -m "chore: reset state + logs [skip ci]"
            git push
            echo "[+] Estado reseteado y pusheado"
          else
            echo "[i] Sin cambios que commitear"
          fi

      # ======================================================================
      # 5. Borrar release snapshot
      # ======================================================================
      - name: Delete snapshot release
        if: ${{ inputs.reset_snapshot }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"

          if gh release view snapshot -R "$REPO" >/dev/null 2>&1; then
            echo "  → Borrando release snapshot..."
            gh release delete snapshot -R "$REPO" -y --cleanup-tag
            echo "[+] Release snapshot borrado (se recreará en el próximo Build)"
          else
            echo "[i] No existe el release snapshot"
          fi

      # ======================================================================
      # 6. Borrar release stable
      # ======================================================================
      - name: Delete stable release
        if: ${{ inputs.delete_stable }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"

          if gh release view stable -R "$REPO" >/dev/null 2>&1; then
            echo "  → Borrando release stable..."
            gh release delete stable -R "$REPO" -y --cleanup-tag
            echo "[+] Release stable borrado (se recreará en el próximo Build)"
          else
            echo "[i] No existe el release stable"
          fi

      # ======================================================================
      # 7. Borrar caché de GitHub Actions
      # ======================================================================
      - name: Delete workflow caches
        if: ${{ inputs.delete_workflow_cache }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"

          cache_keys=$(gh cache list -R "$REPO" --limit 100 --json key --jq '.[].key' 2>/dev/null || echo "")

          if [ -z "$cache_keys" ]; then
            echo "[i] No hay cachés que borrar"
            exit 0
          fi

          count=0
          while IFS= read -r key; do
            [ -z "$key" ] && continue
            echo "  → Borrando caché: $key"
            if gh cache delete "$key" -R "$REPO" 2>/dev/null; then
              count=$((count + 1))
            fi
          done <<< "$cache_keys"
          echo "[+] $count cachés borradas"

      # ======================================================================
      # 8. Resumen final
      # ======================================================================
      - name: Summary
        run: |
          echo "=== Clean & Reset completado ==="
          echo ""
          echo "  Reset versions log:      ${{ inputs.reset_versions_log }}"
          echo "  Reset failed apps queue: ${{ inputs.reset_failed_apps }}"
          echo "  Clean per-app logs:      ${{ inputs.clean_logs }}"
          echo "  Reset snapshot:          ${{ inputs.reset_snapshot }}"
          echo "  Delete stable release:   ${{ inputs.delete_stable }}"
          echo "  Delete workflow caches:  ${{ inputs.delete_workflow_cache }}"
          echo ""
          echo "[i] Próximo Build recompilará lo que corresponda según versions_log.json."