name: Sync Apps in Workflows

on:
  push:
    paths:
      - 'config.toml'
      - 'scripts/sync_workflow_apps.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install toml
        run: python3 -m pip install --no-cache-dir toml

      - name: Sync apps
        run: python3 scripts/sync_workflow_apps.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .github/workflows/ 2>/dev/null || true

          if ! git diff --staged --quiet; then
            git commit -m "chore: sync apps dropdown in workflows [skip ci]"
            git push
            echo "[+] Workflows actualizados y pusheados"
          else
            echo "[i] Sin cambios en los workflows"
          fi