# ============================================================
# Valores válidos de build-mode:
#   "apk"    → genera solo el APK parcheado (default si se omite)
#   "module" → genera solo el ZIP del módulo Magisk/KernelSU
#   "both"   → genera ambos: APK + ZIP
#
# Valores válidos de channel:
#   "stable" → usa la rama main del repo de parches
#   "dev"    → usa la rama dev del repo de parches
#
# force-patch = true:
#   Salta la verificación de compatibilidad de versión del CLI.
#   Equivale al botón "Continue anyway" de Morphe Manager.
#   Útil cuando se aplica un bundle de parches a una versión
#   no listada en compatiblePackages (ej. YouTube Tablet).
#
# enable-patches = [...]:
#   Lista de parches UNIVERSALES (compatiblePackages: null) que
#   se quieren forzar. Por defecto los universales se EXCLUYEN
#   del parcheo aunque inclusive-patches = true.
#
# exclude-patches = [...]:
#   Lista de parches a excluir explícitamente, sin importar
#   si están enabled-by-default. Se pasan a morphe con -d=.
# ============================================================

[Morphe-Desktop]
morphe_desktop_channel = "stable"  # Opciones: "stable" o "dev"
